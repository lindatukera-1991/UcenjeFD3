<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzorak Dokumenta</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .kartica {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }
        .gumb {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .gumb:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="kartica">
        <h1>Dokument Uspješno Kreiran</h1>
        <p>Ovo je gotov primjer HTML stranice s ugrađenim dizajnom. Možete dvaput kliknuti na spremljenu datoteku kako biste je otvorili u svom pregledniku.</p>
        <a href="#" class="gumb" onclick="alert('Ovo je ogledni gumb!')">Isprobaj gumb</a>
    </div>

</body>
</html>
